<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo de Nav com Submenu</title>
  <style>
    /* Barra de navegação superior */
    nav {
      background-color: #001f3f; /* Azul marinho */
      padding: 0.5rem 1rem;
    }

    /* Lista principal da navegação */
    .nav-list {
      display: flex;
      align-items: center;
      list-style: none;
      margin: 0;
      padding: 0;
      gap: 1rem;
    }

    /* Botões e links da navegação */
    .nav-button {
      background-color: #003366; /* Azul mais claro que a barra */
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
      /* Remove estilos padrão de botões */
      -webkit-appearance: none;
      appearance: none;
    }

    /* Hover: muda para azul ciano */
    .nav-button:hover {
      background-color: #00ffff; /* Azul ciano */
      color: black;
    }

    /* Item que contém submenu */
    .nav-item {
      position: relative;
    }

    /* Submenu: inicialmente oculto */
    .nav-submenu {
      display: none;
      position: absolute;
      top: 100%; /* logo abaixo do item pai */
      left: 0;
      background-color: #003366;
      border-radius: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.5rem 0;
      list-style: none;
      min-width: 150px;
      z-index: 1000;
    }

    /* Exibe o submenu quando o mouse está sobre o item ou quando um elemento dentro dele está focado */
    .nav-item:hover .nav-submenu,
    .nav-item:focus-within .nav-submenu {
      display: block;
    }

    /* Itens do submenu */
    .nav-submenu li {
      margin: 0.25rem 0;
    }

    /* Links do submenu ocupam toda a largura e ficam alinhados à esquerda */
    .nav-submenu .nav-button {
      display: block;
      width: 100%;
      text-align: left;
    }
  </style>
</head>
<body>
  <nav>
    <ul class="nav-list">
      <li>
        <a class="nav-button" href="#">Dashboard</a>
      </li>
      <li class="nav-item">
        <!-- Usamos <button> para que o elemento seja interativo -->
        <button type="button" class="nav-button">Tarefas</button>
        <ul class="nav-submenu">
          <li>
            <a class="nav-button" href="#">Listar Tarefas</a>
          </li>
          <li>
            <a class="nav-button" href="#">Criar Tarefa</a>
          </li>
        </ul>
      </li>
      <li>
        <a class="nav-button" href="#">Notas</a>
      </li>
    </ul>
  </nav>
</body>
</html>
